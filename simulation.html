<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Matters — Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#0b0f0d; --ink-2:#141a17; --ink-3:#1c2420;
    --paper:#f1ecdd; --paper-dim:#a9a291;
    --gold:#c9a227; --gold-bright:#e8c65c;
    --red:#c0392b; --red-bright:#e8564a;
    --green:#4c9a6a; --green-bright:#6fc28f;
    --line:#2a332e;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--ink); color:var(--paper); font-family:'Spectral',Georgia,serif; -webkit-font-smoothing:antialiased; }

  /* ============ CHOOSER ============ */
  .chooser{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; text-align:center; padding:40px 20px; }
  .chooser h1{ font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(38px,7vw,64px); color:var(--gold-bright); margin:0; letter-spacing:.01em; }
  .chooser .tag{ font-family:'IBM Plex Mono',monospace; letter-spacing:.2em; text-transform:uppercase; color:var(--paper-dim); font-size:13px; }
  .choice-grid{ display:flex; gap:20px; flex-wrap:wrap; justify-content:center; max-width:900px; }
  .choice-card{ width:230px; border:1px solid var(--line); background:var(--ink-2); padding:26px 20px; cursor:pointer; text-align:left; }
  .choice-card:hover{ border-color:var(--gold); }
  .choice-card .ic{ font-size:28px; }
  .choice-card .n{ font-family:'Anton',sans-serif; font-size:19px; margin:10px 0 6px; color:var(--paper); }
  .choice-card .d{ font-size:13.5px; color:var(--paper-dim); line-height:1.4; }

  /* ============ HOST (projector) ============ */
  body.mode-host{ overflow:hidden; cursor:default; }
  .stage{ position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse 120% 90% at 50% 8%, rgba(201,162,39,.07), transparent 60%), radial-gradient(ellipse 140% 100% at 50% 100%, rgba(0,0,0,.55), transparent 55%), var(--ink); }
  .stage::before{ content:""; position:absolute; inset:0; background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 1px, transparent 3px); pointer-events:none; mix-blend-mode:overlay; z-index:1; }
  .frame{ position:absolute; inset:22px; border:1px solid var(--line); pointer-events:none; z-index:2; }
  .topcorner{ position:absolute; top:34px; left:44px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--paper-dim); z-index:5; }
  .topcorner b{ color:var(--gold); }
  .topright{ position:absolute; top:34px; right:44px; display:flex; gap:10px; z-index:5; }
  .icon-btn{ width:32px; height:32px; border:1px solid var(--line); background:transparent; color:var(--paper-dim); cursor:pointer; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .scene-wrap{ width:min(1040px,86vw); }
  .scene{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:22px; opacity:0; transform:translateY(18px) scale(.985); }
  .scene.enter{ animation: sceneIn .5s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes sceneIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:15px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); }
  .eyebrow.alert{ color:var(--red-bright); } .eyebrow.good{ color:var(--green-bright); }
  .display{ font-family:'Anton',sans-serif; font-weight:400; line-height:.98; text-wrap:balance; color:var(--paper); font-variant-numeric:tabular-nums; }
  .display.huge{ font-size:clamp(56px,9vw,132px); } .display.big{ font-size:clamp(40px,5.6vw,80px); } .display.mid{ font-size:clamp(27px,3.6vw,46px); }
  .display.gold{ color:var(--gold-bright); } .display.red{ color:var(--red-bright); } .display.green{ color:var(--green-bright); }
  .narrative{ font-style:italic; font-size:clamp(19px,2.1vw,27px); line-height:1.5; max-width:760px; }
  .sub{ font-size:clamp(15px,1.4vw,18px); color:var(--paper-dim); max-width:640px; line-height:1.55; }
  .ledger{ width:100%; max-width:560px; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  .lrow{ display:flex; justify-content:space-between; gap:12px; padding:8px 2px; border-bottom:1px dashed var(--line); font-size:16px; opacity:0; animation: rowIn .4s ease forwards; }
  .lrow:last-child{ border-bottom:none; }
  .lrow .lb{ color:var(--paper-dim); text-align:left; } .lrow .v{ color:var(--paper); font-weight:500; } .lrow .v.neg{ color:var(--red-bright); }
  .lrow.total{ border-top:1px solid var(--gold); border-bottom:none; margin-top:4px; padding-top:11px; }
  .lrow.total .lb{ color:var(--gold); text-transform:uppercase; letter-spacing:.08em; font-size:12px; } .lrow.total .v{ color:var(--gold-bright); font-size:20px; font-weight:600; }
  @keyframes rowIn{ from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:translateX(0);} }
  .ticker{ display:flex; gap:34px; flex-wrap:wrap; justify-content:center; font-family:'IBM Plex Mono',monospace; }
  .titem{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:140px; opacity:0; transform:translateY(10px); animation:tIn .5s ease forwards; }
  @keyframes tIn{ to{opacity:1; transform:translateY(0);} }
  .titem .n{ font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--paper-dim); }
  .titem .m{ font-size:clamp(24px,3vw,36px); font-family:'Anton',sans-serif; }
  .card-face{ border:1px solid var(--line); background:var(--ink-2); padding:24px 30px; max-width:640px; position:relative; opacity:0; transform:translateY(22px) rotate(-1.2deg) scale(.97); animation: cardIn .55s cubic-bezier(.2,.85,.3,1) forwards; }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0) rotate(0) scale(1); } }
  .card-face::before{ content:""; position:absolute; top:0; left:22px; right:22px; height:2px; background:var(--gold); opacity:.7; }
  .bar-wrap{ width:100%; max-width:480px; height:7px; background:var(--ink-3); border:1px solid var(--line); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--green-bright); width:100%; }
  .bar-fill.run{ transition:width linear, background-color .4s ease; }
  .timer-label{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.1em; color:var(--paper-dim); text-transform:uppercase; }
  .alert-glow{ animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow: inset 0 0 0 2px rgba(192,57,43,0), 0 0 60px rgba(192,57,43,0);} 50%{ box-shadow: inset 0 0 0 2px rgba(192,57,43,.55), 0 0 90px rgba(192,57,43,.35);} }
  .shake{ animation: shakeKf .5s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shakeKf{ 10%,90%{transform:translate3d(-1px,0,0);} 20%,80%{transform:translate3d(2px,0,0);} 30%,50%,70%{transform:translate3d(-5px,0,0);} 40%,60%{transform:translate3d(5px,0,0);} }
  .flash{ position:fixed; inset:0; pointer-events:none; z-index:30; opacity:0; }
  .flash.hit{ animation: flashKf .6s ease-out; }
  .flash.good{ background:var(--gold-bright); } .flash.bad{ background:var(--red); }
  @keyframes flashKf{ 0%{opacity:.55;} 100%{opacity:0;} }
  .progress-dots{ position:absolute; bottom:26px; left:50%; transform:translateX(-50%); display:flex; gap:4px; z-index:3; flex-wrap:wrap; max-width:70vw; justify-content:center; }
  .dot{ width:4px; height:4px; border-radius:50%; background:var(--line); } .dot.active{ background:var(--gold); }
  .hint{ position:absolute; bottom:34px; right:44px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:var(--paper-dim); text-transform:uppercase; opacity:.55; z-index:3; }
  .notes{ position:fixed; left:0; right:0; bottom:0; background:rgba(0,0,0,.92); border-top:1px solid var(--gold); color:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:13.5px; line-height:1.6; padding:16px 44px; max-height:30vh; overflow:auto; display:none; z-index:40; }
  .notes.show{ display:block; } .notes b{ color:var(--gold-bright); }
  .final-grid{ display:grid; grid-template-columns:repeat(2,minmax(220px,1fr)); gap:16px; width:100%; max-width:760px; text-align:left; }
  .final-card{ border:1px solid var(--line); background:var(--ink-2); padding:18px 20px; }
  .final-card .fname{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin-bottom:7px; }
  .final-card p{ margin:0; font-size:14.5px; color:var(--paper-dim); line-height:1.5; }
  .qrbox{ background:var(--paper); padding:16px; border-radius:8px; display:inline-block; line-height:0; }
  .qrbox svg{ width:200px; height:200px; display:block; }
  .lb-list{ width:100%; max-width:600px; display:flex; flex-direction:column; gap:8px; text-align:left; }
  .lb-row{ display:flex; align-items:center; gap:14px; border:1px solid var(--line); background:var(--ink-2); padding:11px 16px; font-family:'IBM Plex Mono',monospace; opacity:0; animation:rowIn .35s ease forwards; }
  .lb-row .rank{ width:28px; color:var(--gold); font-weight:600; }
  .lb-row .nm{ flex:1; color:var(--paper); }
  .lb-row .sc{ color:var(--gold-bright); font-weight:600; }
  .lb-row.top1{ border-color:var(--gold); background:rgba(201,162,39,.08); }
  .setup-wrap{ width:min(1100px,92vw); max-height:88vh; overflow:auto; padding:20px 0; }
  .setup-wrap h1{ font-family:'Anton',sans-serif; font-weight:400; color:var(--gold-bright); font-size:32px; margin:0 0 6px; }
  .setup-tbl{ width:100%; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:13px; margin-top:16px; }
  .setup-tbl th,.setup-tbl td{ border:1px solid var(--line); padding:7px 8px; text-align:center; }
  .setup-tbl th{ color:var(--gold); text-transform:uppercase; font-size:11px; letter-spacing:.06em; }
  .setup-tbl input{ width:56px; background:var(--ink-2); border:1px solid var(--line); color:var(--paper); font-family:'IBM Plex Mono',monospace; padding:4px; text-align:center; border-radius:3px; }
  .setup-tbl td.m{ color:var(--paper-dim); }
  .setup-actions{ display:flex; gap:12px; margin-top:20px; position:sticky; bottom:0; background:var(--ink); padding:12px 0; }
  .btn{ font-family:'IBM Plex Mono',monospace; font-weight:600; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--gold); background:var(--gold); color:var(--ink); padding:13px 22px; border-radius:3px; cursor:pointer; font-size:13px; }
  .btn.ghost{ background:transparent; color:var(--paper); border-color:var(--line); }
  .btn:active{ transform:scale(.98); }

  /* ============ PLAYER (phone) ============ */
  body.mode-player, body.mode-quick{ display:flex; justify-content:center; }
  .app{ width:100%; max-width:480px; min-height:100vh; position:relative; display:flex; flex-direction:column; }
  .quickband{ background:var(--gold); color:var(--ink); text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:6px; font-weight:700; }
  .topbar{ position:sticky; top:0; z-index:10; padding:10px 16px 8px; background:linear-gradient(180deg, var(--ink) 70%, rgba(11,15,13,0)); display:flex; flex-direction:column; gap:8px; }
  .topbar.hidden{ display:none; }
  .tb-row{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-family:'Anton',sans-serif; font-size:13px; letter-spacing:.04em; color:var(--paper-dim); }
  .loc{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:var(--gold); text-transform:uppercase; }
  .stats{ display:flex; gap:8px; }
  .stat{ flex:1; border:1px solid var(--line); background:var(--ink-2); padding:7px 9px; position:relative; }
  .stat .l{ font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--paper-dim); }
  .stat .v{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat .d{ position:absolute; right:6px; top:-9px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; padding:1px 5px; border-radius:3px; opacity:0; }
  .stat .d.show{ animation: pop 1.6s ease forwards; }
  .stat .d.pos{ background:rgba(76,154,106,.2); color:var(--green-bright); } .stat .d.neg{ background:rgba(192,57,43,.2); color:var(--red-bright); }
  @keyframes pop{ 0%{opacity:0; transform:translateY(3px);} 15%{opacity:1; transform:translateY(0);} 75%{opacity:1;} 100%{opacity:0; transform:translateY(-6px);} }
  .segs{ display:flex; gap:2px; }
  .seg{ flex:1; height:3px; background:var(--line); } .seg.done{ background:var(--gold); } .seg.now{ background:var(--gold-bright); }
  .pstage{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:20px 20px 28px; gap:16px; text-align:center; }
  .pstage.enter{ animation: stageIn .42s cubic-bezier(.2,.8,.3,1); }
  @keyframes stageIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  h1.disp{ font-family:'Anton',sans-serif; font-weight:400; line-height:1; margin:0; text-wrap:balance; }
  .disp.xl{ font-size:clamp(34px,10vw,50px); } .disp.lg{ font-size:clamp(26px,7.5vw,36px); }
  .disp.gold{ color:var(--gold-bright); } .disp.red{ color:var(--red-bright); }
  .psub{ font-size:14.5px; color:var(--paper-dim); line-height:1.5; }
  .pnarr{ font-style:italic; font-size:17px; line-height:1.5; }
  .pledger{ width:100%; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; text-align:left; }
  .plrow{ display:flex; justify-content:space-between; padding:6px 2px; border-bottom:1px dashed var(--line); font-size:13.5px; opacity:0; animation:rowIn .35s ease forwards; }
  .plrow.total{ border-top:1px solid var(--gold); border-bottom:none; margin-top:2px; padding-top:9px; }
  .plrow.total .lb{ color:var(--gold); text-transform:uppercase; font-size:10.5px; letter-spacing:.08em; } .plrow.total .v{ color:var(--gold-bright); font-size:16.5px; font-weight:600; }
  .pbtn{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--gold); background:var(--gold); color:var(--ink); padding:14px 18px; border-radius:3px; cursor:pointer; width:100%; }
  .pbtn.ghost{ background:transparent; color:var(--paper); border-color:var(--line); }
  .pbtn.big{ padding:17px; font-size:14.5px; } .pbtn:active{ transform:scale(.98); } .pbtn:disabled{ opacity:.35; }
  .prow2{ display:flex; gap:9px; } .prow2 .pbtn{ flex:1; }
  .card-stack{ position:relative; height:190px; margin:2px 0; }
  .swipe-card{ position:absolute; inset:0; border:1px solid var(--line); background:var(--ink-2); border-radius:10px; padding:20px; display:flex; align-items:center; justify-content:center; touch-action:pan-y; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .swipe-card .txt{ font-style:italic; font-size:16px; line-height:1.45; }
  .swipe-hint{ position:absolute; top:10px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:4px 9px; border-radius:3px; opacity:0; }
  .swipe-hint.left{ left:10px; color:var(--red-bright); border:1px solid var(--red-bright); } .swipe-hint.right{ right:10px; color:var(--green-bright); border:1px solid var(--green-bright); }
  .chiprow{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
  .chip{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; border:1px solid var(--line); background:var(--ink-2); color:var(--paper); padding:9px 13px; border-radius:20px; cursor:pointer; }
  .chip.active{ border-color:var(--gold); color:var(--gold-bright); background:rgba(201,162,39,.12); }
  .strategy{ display:flex; flex-direction:column; gap:7px; text-align:left; }
  .strat-opt{ border:1px solid var(--line); background:var(--ink-2); padding:11px 13px; border-radius:6px; cursor:pointer; }
  .strat-opt.active{ border-color:var(--gold); }
  .strat-opt .name{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin-bottom:2px; }
  .strat-opt .desc{ font-size:12.5px; color:var(--paper-dim); }
  .badge-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; text-align:left; }
  .badge{ border:1px solid var(--line); background:var(--ink-2); padding:11px; border-radius:8px; opacity:.35; }
  .badge.earned{ opacity:1; border-color:var(--gold); }
  .badge .ic{ font-size:20px; } .badge .n{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; margin-top:3px; color:var(--gold-bright); }
  .badge .d{ font-size:11.5px; color:var(--paper-dim); margin-top:2px; }
  input.nametxt{ width:100%; background:var(--ink-2); border:1px solid var(--line); color:var(--paper); font-family:'Spectral',Georgia,serif; font-size:16px; padding:12px 13px; border-radius:4px; text-align:center; }
  .footer-note{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--paper-dim); opacity:.6; letter-spacing:.05em; }
  .mathbox{ text-align:left; border:1px solid var(--line); background:var(--ink-2); padding:12px 14px; border-radius:6px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; line-height:1.7; color:var(--paper-dim); }
  .mathbox b{ color:var(--gold-bright); }
  .rankpill{ display:inline-block; border:1px solid var(--gold); color:var(--gold-bright); padding:5px 12px; border-radius:20px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.06em; }

  /* ============ TRIVIA (host) ============ */
  .trivia-opts{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-family:'IBM Plex Mono',monospace; }
  .topt{ border:1px solid var(--line); background:var(--ink-2); padding:13px 26px; font-size:15px; letter-spacing:.06em; text-transform:uppercase; }

  /* ============ MATH SHEET (print) ============ */
  .mathsheet{ background:#f1ecdd; color:#211d15; min-height:100vh; padding:40px 30px; }
  .mathsheet .inner{ max-width:760px; margin:0 auto; }
  .mathsheet h1{ font-family:'Anton',sans-serif; font-size:32px; margin:0 0 6px; }
  .mathsheet h2{ font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#8a6a17; margin:28px 0 8px; }
  .mathsheet .formula{ font-family:'IBM Plex Mono',monospace; background:#e9e2cd; border:1px solid #c9c2ac; padding:12px 14px; border-radius:6px; font-size:14px; margin:8px 0; }
  .mathsheet p{ font-size:14.5px; line-height:1.6; color:#4a4436; }
  .mathsheet .example{ border-left:3px solid #8a6a17; padding-left:14px; margin:10px 0; }
  .print-btn{ font-family:'IBM Plex Mono',monospace; font-weight:700; text-transform:uppercase; letter-spacing:.06em; background:#211d15; color:#f1ecdd; border:none; padding:12px 22px; border-radius:4px; cursor:pointer; }
  @media print{ .print-btn{ display:none; } }

  @media (prefers-reduced-motion:reduce){ .scene.enter,.card-face,.lrow,.titem,.flash.hit,.shake,.pstage.enter,.plrow{ animation:none !important; } .bar-fill.run{ transition:none; } }
</style>
</head>
<body>

<div id="root"></div>

<script>
/* =====================================================================
   MONEY MATTERS — SIMULATION
   Two years, twenty-four months. One artifact, three roles:
   host (projector), player (phone via QR), quick (solo taster).
   ===================================================================== */
const RUPEE = n => '₹' + Math.round(n).toLocaleString('en-IN');
const num = s => typeof s==='number' ? s : Number(String(s).replace(/,/g,''));
const SUPPORT = 5000;

/* ---------------- shared month data (2 years, India-flavoured, no family framing) ----------------
   Rebalanced so the year has real bite: Year 1 keeps subsidised hostel-level fixed costs, but
   Year 2 (independent living for the internship/job) carries a real rent jump — the raise you
   earn barely outruns it, on purpose. */
const MONTHS = [
 {n:1, job:14000, fixed:1800,
   cards:[{t:'Your phone screen cracks badly — you can barely read messages. A repair shop near college can fix it today.', c:900, tag:'necessity'},
          {t:'A classmate is turning 19 this weekend. The friend group is chipping in for a gift.', c:600, tag:'social', casual:true}]},
 {n:2, job:13000, fixed:2400, fixedNote:'includes a ₹600 late course-registration fee',
   cards:[{t:'New semester — you need fresh notebooks and stationery for every subject.', c:500, tag:'necessity'},
          {t:'A 50%-off sale on a dress you’ve wanted for weeks ends tonight.', c:1100, tag:'discretionary'}]},

function fbWritePlayer(id, name){
  if(!fdb) return;
  fdb.collection('players').doc(id).set({ name, joinedAt: Date.now() }).catch(()=>{});
}
function fbWriteScore(id, name, finalScore){
  if(!fdb) return;
  fdb.collection('leaderboard').doc(id).set({ name, finalScore, updatedAt: Date.now() }).catch(()=>{});
}
function fbWatchPlayers(onData, onError){
  if(!fdb) return null;
  return fdb.collection('players').orderBy('joinedAt','asc').limit(80)
    .onSnapshot(snap=>onData(snap.docs.map(d=>d.data())), onError);
}
function fbWatchLeaderboard(onData, onError){
  if(!fdb) return null;
  return fdb.collection('leaderboard').orderBy('finalScore','desc').limit(20)
    .onSnapshot(snap=>onData(snap.docs.map(d=>d.data())), onError);
}

/* ---------------- facilitator-controlled pace ----------------
   The host writes the current unlocked month to session/state; every phone watches it and
   won't advance into the NEXT month's content until the host has actually started it. */
function fbSetGate(month){
  if(!fdb) return;
  fdb.collection('session').doc('state').set({ gate: month }, { merge: true }).catch(()=>{});
}
function fbWatchGate(onData, onError){
  if(!fdb) return null;
  return fdb.collection('session').doc('state')
    .onSnapshot(doc=>onData(doc.exists ? (doc.data().gate || 0) : 0), onError);
}
async function fbResetSession(){
  if(!fdb) return;
  for(const col of ['players','leaderboard']){
    const snap = await fdb.collection(col).get();
    let batch = fdb.batch(); let n = 0;
    for(const d of snap.docs){ batch.delete(d.ref); n++; if(n>=400){ await batch.commit(); batch = fdb.batch(); n=0; } }
    if(n>0) await batch.commit();
  }
  await fdb.collection('session').doc('state').set({ gate: 0 });
}

let hostMuted = false, hostAc = null;
function hac(){ if(!hostAc){ try{ hostAc = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(hostAc && hostAc.state==='suspended') hostAc.resume(); return hostAc; }
function htone(freq,dur,type,gain,delay){ if(hostMuted) return; const c=hac(); if(!c) return; const t0=c.currentTime+(delay||0); const osc=c.createOscillator(), g=c.createGain(); osc.type=type||'sine'; osc.frequency.setValueAtTime(freq,t0); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(gain||0.05,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); osc.connect(g).connect(c.destination); osc.start(t0); osc.stop(t0+dur+0.02); }
const hsfx = {
  up:()=>{ htone(440,.14,'sine',.05,0); htone(660,.22,'sine',.05,.08); },
  down:()=>{ htone(300,.22,'sine',.05,0); htone(190,.3,'sine',.05,.1); },
  coin:()=>{ htone(880,.08,'square',.03,0); htone(1180,.12,'square',.03,.06); },
  tick:()=>{ htone(1000,.03,'square',.02,0); },
  alarm:()=>{ for(let k=0;k<4;k++){ htone(700,.16,'sawtooth',.045,k*.24); htone(500,.16,'sawtooth',.045,k*.24+.12); } },
};
let musicNodes = [], musicOn = false, musicMaster = null;
function startMusic(){
  const c = hac(); if(!c || musicOn) return; musicOn = true;
  // Soft instrumental pad — slow overlapping sustained chords, no plucked notes, nothing
  // percussive. Four gentle chords crossfade into one another on an eight-second cycle.
  musicMaster = c.createGain(); musicMaster.gain.value = 0.05;
  const warmth = c.createBiquadFilter(); warmth.type='lowpass'; warmth.frequency.value = 1100;
  musicMaster.connect(warmth); warmth.connect(c.destination);

  const chords = [
    [220.00, 261.63, 329.63, 392.00],   // Am7
    [174.61, 220.00, 261.63, 349.23],   // Fmaj7
    [130.81, 164.81, 196.00, 246.94],   // Cmaj7
    [196.00, 246.94, 293.66, 349.23],   // G6
  ];
  const HOLD = 9; // seconds each chord is held, with long overlapping fades
  let i = 0;

  function padChord(freqs, delay, dur){
    const t0 = c.currentTime + delay;
    freqs.forEach((f,idx)=>{
      const o = c.createOscillator(), g = c.createGain();
      o.type = idx===0 ? 'sine' : 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.22/freqs.length, t0+3.0);       // slow swell in
      g.gain.linearRampToValueAtTime(0.22/freqs.length, t0+dur-3.5);   // hold
      g.gain.linearRampToValueAtTime(0, t0+dur);                       // slow fade out
      o.connect(g); g.connect(musicMaster);
      o.start(t0); o.stop(t0+dur+0.2);
    });
  }

  function loop(){
    if(!musicOn) return;
    padChord(chords[i % chords.length], 0, HOLD + 2);
    i++;
    musicNodes.push(setTimeout(loop, HOLD*1000));
  }
  loop();
}
function stopMusic(){ musicOn=false; musicNodes.forEach(clearTimeout); musicNodes=[]; }

    scenes.push({type:'settle', month:'MONTH '+m.n, note:'Everyone checks their phone recap — Wallet, Fund, Invested, and this month’s maths if they want it.', eyebrow:'MONTH '+m.n+' CLOSED', title:'CHECK YOUR PHONE RECAP'});

    // trivia breaks at a few natural points
    if(m.n===3){ pushTrivia(scenes,'A SIP means investing the same fixed amount every month, automatically.','TRUE','A SIP (Systematic Investment Plan) invests a fixed amount every month automatically — small and boring, which is exactly why it works over years.'); }
    if(m.n===8){ pushTrivia(scenes,'"Double your money in 30 days, guaranteed" is a normal, safe investment offer.','FALSE','No legitimate investment guarantees doubling your money in a month. Guaranteed, fast, too-good-to-check — that pattern is the classic sign of a scam.'); }
    if(m.n===10){ pushTrivia(scenes,'It’s normal for stock prices to fall sharply sometimes, even in a healthy market.','TRUE','Sharp short-term drops are a normal part of how markets behave — not a sign something is broken.'); }
    if(m.n===15){ pushTrivia(scenes,'Gold jewellery you wear counts as a strong investment asset.','FALSE','Making charges and resale loss eat into jewellery’s value. Digital gold or Sovereign Gold Bonds are the form that actually behaves like an investment.'); }
    if(m.n===22){ pushTrivia(scenes,'Once you dip into your Emergency Fund, you never need to refill it.','FALSE','An Emergency Fund is meant to be used — and then rebuilt. That rebuilding is just as important as building it the first time.'); }
  });

  scenes.push({type:'debrief', eyebrow:'LET’S TALK', title:'WHAT DID YOU NOTICE?', rows:[
    ['Who never touched their fund except for a real emergency?',''],
    ['Who pulled back on stocks after Month 10 — did you miss the Month 16 recovery?',''],
    ['Where do you stand on the leaderboard, and does that match how it felt to play?',''],
    ['Those scam cards — who said yes, and why did it feel tempting in the moment?',''],
  ]});
  scenes.push({type:'lesson', eyebrow:'THE ONE RULE', title:'AN EMERGENCY FUND ISN’T FOR INVESTING.', sub:'It’s the money that means you never have to take a bad loan, sell an investment at a loss, or go without, when something goes wrong. It grows slowly, on purpose — and when you use it, you rebuild it.'});
  scenes.push({type:'final', eyebrow:'ONCE YOUR FUND IS BUILT', title:'FOUR WAYS TO GROW WHAT’S LEFT', note:'Real numbers and rules of thumb come from [ADVISOR NAME], who joined us to answer questions.', cards:[
    ['GOLD','A steady hedge that tends to hold its value over years. Digital gold or Sovereign Gold Bonds — not jewellery — is the form that actually works as an investment.'],
    ['SIP','Small, fixed amounts invested automatically every month into a mutual fund. Slow and unglamorous — which is exactly why it works over 5-10 years.'],
    ['STOCKS','Ownership in a real company. Can rise or fall sharply in the short term — only for money you won’t need soon, and only if you can hold through a dip.'],
    ['FD','A fixed deposit locks money at a bank for a set time at a guaranteed rate. Low risk, low return, and breaking it early usually costs you a penalty.'],
  ]});
  scenes.push({type:'thanks', eyebrow:'THANK YOU', title:'YOUR BALANCE, YOUR CHOICES', sub:'Two years, twenty-four months. The habits you practiced here are the same ones you’ll use for the rest of your working life.'});
  return scenes;
}
function pushTrivia(scenes, statement, answer, explain){
  scenes.push({type:'trivia', note:'Quick-fire round. Give the room a few seconds to shout an answer, then advance.', timer:10, eyebrow:'QUICK FIRE', statement});
  scenes.push({type:'triviaReveal', note:'Reveal: '+answer+'.', eyebrow:'QUICK FIRE — ANSWER', answer, explain});
}

function startPlayer(isQuick){
  const monthsToPlay = isQuick ? MONTHS.slice(0,3) : MONTHS;
  root.innerHTML = `${isQuick?'<div class="quickband">⚡ Quick Taster — 3 months, solo, nothing saved to a leaderboard</div>':''}
    <div class="app" id="app">
      <div class="topbar" id="topbar">
        <div class="tb-row"><span class="brand">MONEY MATTERS</span><span class="loc" id="ploc"></span></div>
        <div class="stats">
          <div class="stat"><div class="l">Wallet</div><div class="v" id="vWallet">₹0</div><div class="d" id="dWallet"></div></div>
          <div class="stat"><div class="l">Emerg. Fund</div><div class="v" id="vEF">₹0</div><div class="d" id="dEF"></div></div>
          <div class="stat"><div class="l">Invested</div><div class="v" id="vInv">₹0</div><div class="d" id="dInv"></div></div>
        </div>
        <div class="segs" id="psegs"></div>
      </div>
      <div class="pstage" id="pstage"></div>
    </div><div class="flash" id="pflash"></div>`;

  let playerId = null;
  try{ playerId = localStorage.getItem('mm_player_id'); if(!playerId){ playerId = 'p'+Math.random().toString(36).slice(2,10); localStorage.setItem('mm_player_id', playerId); } }catch(e){ playerId = 'p'+Math.random().toString(36).slice(2,10); }

  // Market numbers are the same fixed defaultMarket() the host uses — no backend needed to keep them in sync.
  const market = defaultMarket();

  // Facilitator-controlled pace: liveGate is the highest month the host has actually reached.
  let liveGate = 0, waitingFor = null, waitingResolve = null;
  if(!isQuick){
    fbWatchGate(g=>{
      liveGate = g;
      if(waitingFor!=null && liveGate>=waitingFor){ const r=waitingResolve; waitingFor=null; waitingResolve=null; if(r) r(); }
    });
  }
  function waitForGate(month, cb){
    if(isQuick || liveGate>=month){ cb(); return; }
    waitingFor = month; waitingResolve = cb;
    const stage = document.getElementById('pstage');
    stage.innerHTML = `<div class="eyebrow gold">HOLD ON</div><h1 class="disp lg">WAITING FOR YOUR FACILITATOR</h1><div class="psub">Month ${month} hasn’t started on the big screen yet. This continues on its own the moment it does.</div>`;
    stage.classList.remove('enter'); void stage.offsetWidth; stage.classList.add('enter');
  }

  let state = { name:'', wallet:0, ef:0, gold:0, sip:0, stocks:0, loan:0, quarterIncomeSum:0,
    flags:{dipUsedForNonEmergency:false, scamPaid:false, socialPaid:0, socialTotal:0, selfinvestPaid:0, investRounds:0} };
  if(!isQuick){
    try{ const saved = JSON.parse(localStorage.getItem('mm_state_v1')||'null'); if(saved) state = saved; }catch(e){}
  }
  function save(){ if(isQuick) return; try{ localStorage.setItem('mm_state_v1', JSON.stringify(state)); }catch(e){} }
  function invTotal(){ return state.gold+state.sip+state.stocks; }
  function finalScore(){ return state.wallet+state.ef+invTotal()-state.loan; }
  function resetForRealGame(){
    state = { name: state.name, wallet:0, ef:0, gold:0, sip:0, stocks:0, loan:0, quarterIncomeSum:0,
      flags:{dipUsedForNonEmergency:false, scamPaid:false, socialPaid:0, socialTotal:0, selfinvestPaid:0, investRounds:0} };
    save();
  }

  let program = [];
  function pushMonth(m){
    program.push({type:'monthhead', m});
    program.push({type:'income', m});
    program.push({type:'expense', m});
    program.push({type:'ef', m});
    (m.cards||[]).forEach((c,idx)=>program.push({type:'card', m, c, idx}));
    if(!m.trial){
      const isQuarterEnd = (typeof m.n==='number' && m.n % 3 === 0);
      if(isQuarterEnd && !m.emergency){ program.push({type:'invest', m}); }
      if(m.emergency){ program.push({type:'emergency', m}); }
      program.push({type:'reveal', m});
    }
    program.push({type:'recap', m});
  }
  function buildProgram(){
    program = [{type:'welcome'},{type:'rules'}];
    if(!isQuick){
      TRIAL_MONTHS.forEach(pushMonth);
      program.push({type:'trialend'});
    }
    monthsToPlay.forEach(pushMonth);
    program.push({type:'finale'});
  }
  buildProgram();

  let pi = 0, chosenAmt=null, chosenStrat=null, showMath=false;

  function animateStat(key, elId){
    const el = document.getElementById(elId); const from = parseFloat(el.dataset.raw||'0');
    const to = key==='wallet'?state.wallet:key==='ef'?state.ef:invTotal();
    const t0=performance.now(), dur=600;
    function step(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=RUPEE(from+(to-from)*e); if(p<1) requestAnimationFrame(step); else { el.textContent=RUPEE(to); el.dataset.raw=to; } }
    requestAnimationFrame(step);
  }
  function flashDelta(amount, elId){ if(!amount) return; const el=document.getElementById(elId); el.textContent=(amount>0?'+':'−')+RUPEE(Math.abs(amount)); el.className='d show '+(amount>0?'pos':'neg'); void el.offsetWidth; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }

    if(d.wallet){ state.wallet+=d.wallet; animateStat('wallet','vWallet'); flashDelta(d.wallet,'dWallet'); }

  }
  function psegs(){ const cur=program[pi]; const curM = (cur&&cur.m&&typeof cur.m.n==='number')?cur.m.n:(cur&&cur.type==='finale'?monthsToPlay.length:0); const total=monthsToPlay.length; let html=''; for(let k=1;k<=total;k++){ html+=`<div class="seg ${curM>k?'done':curM===k?'now':''}"></div>`; } document.getElementById('psegs').innerHTML=html; }
  function ploc(){ const cur=program[pi]; if(cur&&cur.m&&cur.m.trial){ document.getElementById('ploc').textContent='TRIAL'; return; } document.getElementById('ploc').textContent = cur&&cur.m? 'MONTH '+cur.m.n+(isQuick?' / 3':' / 24') : ''; }
  function pflash(cls){ const f=document.getElementById('pflash'); f.className='flash '+cls; void f.offsetWidth; f.classList.add('hit'); }
  function pshake(){ const a=document.getElementById('app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); }

    if(extra) html += '<br>'+extra;
    html += `</div>`;
    return html;
  }

    }
    else if(st.type==='emergency'){
      html = `<div class="eyebrow alert">EMERGENCY</div><h1 class="disp lg red">${emergencyTitle(st.m.n)}</h1><h1 class="disp xl red">${RUPEE(st.m.emergency)}</h1>

  window.__mm_start = ()=>{
    state.name = document.getElementById('nameInput').value.trim(); save();

  window.__mm_next = pnext;
  window.__mm_startReal = ()=>{ waitForGate(1, ()=>{ resetForRealGame(); pnext(); }); };

  window.__mm_income = (total, loanDue)=>{ applyDelta({wallet: total-(loanDue||0)}); if(loanDue){ state.loan=0; save(); } pnext(); };
  window.__mm_expense = (fixed)=>{ applyDelta({wallet:-fixed}); pnext(); };
  window.__mm_ef = (amt)=>{ applyDelta({wallet:-amt, ef:amt}); pnext(); };
  window.__mm_toggleMath = ()=>{ showMath=true; prender(); };
  window.__mm_card = (choice)=>{
    const st = program[pi]; const c = st.c;
    if(choice===true){ applyDelta({wallet:-c.c}); if(c.tag==='scam') state.flags.scamPaid=true; if(c.tag==='social') state.flags.socialPaid++; if(c.tag==='selfinvest') state.flags.selfinvestPaid++; }
    else if(choice==='ef'){ applyDelta({ef:-c.c}); state.flags.dipUsedForNonEmergency=true; pflash('bad'); }

  };
  window.__mm_pickAmt = (v)=>{
    chosenAmt=v;
    document.querySelectorAll('#amtChips .chip').forEach(el=>el.classList.toggle('active', Number(el.dataset.v)===v));

  };
  window.__mm_pickStrat = (k)=>{ chosenStrat=k; document.querySelectorAll('.strat-opt').forEach(el=>el.classList.toggle('active', el.dataset.k===k)); const go=document.getElementById('investGo'); go.disabled=false; go.textContent='Invest '+RUPEE(chosenAmt)+' →'; };

      animateStat('wallet','vWallet'); flashDelta(-chosenAmt,'dWallet'); animateStat('inv','vInv'); flashDelta(chosenAmt,'dInv'); }

      stage.innerHTML = `<div class="eyebrow" style="color:var(--green-bright)">HANDLED</div><h1 class="disp lg gold">PAID FROM YOUR EMERGENCY FUND</h1><div class="psub">No loan, no panic. This is exactly what the fund was for.</div><button class="pbtn big" onclick="window.__mm_next()">Continue →</button>`;
    } else { const gap=bill-state.ef; const loanCost=Math.round(gap*1.2); state.ef=0; state.loan+=loanCost; save();

      stage.innerHTML = `<div class="eyebrow alert">NOT ENOUGH SAVED</div><h1 class="disp lg red">PENALTY LOAN TAKEN</h1>

    state.gold*=(1+mk.gold/100); state.sip*=(1+mk.sip/100); state.stocks*=(1+mk.stocks/100);
    const delta = invTotal()-before;
    const stage = document.getElementById('pstage');
    const bad = mk.stocks<0; if(bad){ pshake(); pflash('bad'); } else { pflash('good'); }
    animateStat('inv','vInv'); flashDelta(delta,'dInv'); save();
    stage.innerHTML = `<div class="eyebrow">RESULTS</div><h1 class="disp lg">THIS MONTH’S MOVEMENT</h1>
      <div class="ticker" style="display:flex;justify-content:space-around;gap:8px;">
        <div class="tk" style="display:flex;flex-direction:column;align-items:center;"><span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--paper-dim);text-transform:uppercase;">Gold</span><span style="font-family:'Anton',sans-serif;font-size:20px;color:${mk.gold<0?'var(--red-bright)':'var(--green-bright)'}">${mk.gold<0?'▼':'▲'} ${Math.abs(mk.gold).toFixed(1)}%</span></div>
        <div class="tk" style="display:flex;flex-direction:column;align-items:center;"><span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--paper-dim);text-transform:uppercase;">SIP</span><span style="font-family:'Anton',sans-serif;font-size:20px;color:${mk.sip<0?'var(--red-bright)':'var(--green-bright)'}">${mk.sip<0?'▼':'▲'} ${Math.abs(mk.sip).toFixed(1)}%</span></div>
        <div class="tk" style="display:flex;flex-direction:column;align-items:center;"><span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--paper-dim);text-transform:uppercase;">Stocks</span><span style="font-family:'Anton',sans-serif;font-size:20px;color:${mk.stocks<0?'var(--red-bright)':'var(--green-bright)'}">${mk.stocks<0?'▼':'▲'} ${Math.abs(mk.stocks).toFixed(1)}%</span></div>
      </div>
      <div class="psub">Your investments: ${RUPEE(before)} → <b style="color:var(--gold-bright)">${RUPEE(invTotal())}</b></div>
      <button class="pbtn big" onclick="window.__mm_afterReveal()">Continue →</button>`;
  };
  window.__mm_afterReveal = ()=>{ pnext(); };
  window.__mm_restart = ()=>{
    state = { name:'', wallet:0, ef:0, gold:0, sip:0, stocks:0, loan:0, quarterIncomeSum:0, flags:{dipUsedForNonEmergency:false, scamPaid:false, socialPaid:0, socialTotal:0, selfinvestPaid:0, investRounds:0} };
    save(); pi=0; prender();
  };

  function computeBadges(){
    const f = state.flags;
    return [
      {icon:'🛡️', name:'Fund Guardian', desc:'Never dipped in except for the real emergencies', earned: !f.dipUsedForNonEmergency},
      {icon:'🎯', name:'Scam Spotter', desc:'Walked away from every "guaranteed returns" pitch', earned: !f.scamPaid},
      {icon:'💛', name:'Community Anchor', desc:'Showed up for friends and community all the way through', earned: f.socialTotal>0 && f.socialPaid/f.socialTotal>=0.7},
      {icon:'📈', name:'Steady Investor', desc:'Kept investing through the ups and downs', earned: f.investRounds>=2},
      {icon:'🌱', name:'Self Investor', desc:'Spent on skills and opportunities, not just wants', earned: f.selfinvestPaid>=1},
      {icon:'🔁', name:'Comeback', desc:'Rebuilt the fund after an emergency', earned: state.ef>=4000},
    ];
  }

  function attachSwipe(canSkip){
    const card = document.getElementById('swipeCard'); if(!card) return;
    let sx=0,dx=0,dragging=false;
    const hintL=document.getElementById('hintLeft'), hintR=document.getElementById('hintRight');
    function start(x){ dragging=true; sx=x; }
    function move(x){ if(!dragging) return; dx=x-sx; card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; if(hintL) hintL.style.opacity=(canSkip&&dx<-20)?Math.min(1,-dx/100):0; if(hintR) hintR.style.opacity=dx>20?Math.min(1,dx/100):0; }
    function end(){ if(!dragging) return; dragging=false;
      if(dx>90){ card.style.transform='translateX(400px) rotate(18deg)'; card.style.transition='transform .3s ease'; setTimeout(()=>window.__mm_card(true),200); }
      else if(canSkip && dx<-90){ card.style.transform='translateX(-400px) rotate(-18deg)'; card.style.transition='transform .3s ease'; setTimeout(()=>window.__mm_card(false),200); }
      else { card.style.transition='transform .25s ease'; card.style.transform=''; if(hintL) hintL.style.opacity=0; if(hintR) hintR.style.opacity=0; }
      dx=0;
    }
    card.addEventListener('pointerdown', e=>{ card.style.transition=''; start(e.clientX); card.setPointerCapture(e.pointerId); });
    card.addEventListener('pointermove', e=>move(e.clientX));
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  }

  prender();
}

/* =====================================================================
   MATH SHEET (printable reference — how every number is calculated)
   ===================================================================== */
function renderMathSheet(){
  document.body.className='mode-math';
  const m3 = MONTHS[2], m9 = MONTHS[8];
  root.innerHTML = `<div class="mathsheet"><div class="inner">
    <button class="print-btn" onclick="window.print()" style="float:right;">Print this page</button>
    <a href="index.html" style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:#8a6a17; text-decoration:none;">← Back to homepage</a>
    <h1>Money Matters — Rules & the Maths</h1>
    <p>Everything you need before you play: how the game works, and the exact arithmetic behind every number it shows. This is the page to read first.</p>

    <h2>How to play</h2>
    <p><b>Two years, twenty-four months.</b> One person runs the projector (the facilitator); everyone else plays on her own phone, scanned in from a QR code. The screen tells the story out loud, month by month — income, expenses, decisions, the market. Your phone does the actual arithmetic and keeps your own private running total.</p>
    <p>Every month follows the same shape:</p>
    <div class="formula">Income arrives → Fixed costs are paid → 10% moves to your Emergency Fund → two decision cards → (some months) an investing round → the market moves → you check your recap</div>
    <p>You always have three balances: your <b>Wallet</b> (day-to-day spending), your <b>Emergency Fund</b> (only for real emergencies — the game will force one on you, more than once), and your <b>Investments</b> (Gold, SIP and Stocks). At the end, your final score is all three added together, minus any loan you're still carrying.</p>

    <h2>1. Monthly income</h2>
    <div class="formula">Income = ₹2,500 (pocket money) + ₹2,500 (groceries) + that month's work income</div>
    <div class="example"><p><b>Month 3 example:</b> ₹2,500 + ₹2,500 + ₹15,000 (work) = <b>₹20,000</b></p></div>

    <h2>2. After fixed expenses</h2>
    <div class="formula">Remaining = Income − Fixed expenses</div>
    <div class="example"><p><b>Month 3:</b> ₹20,000 − ₹1,800 = <b>₹18,200</b></p></div>

    <h2>3. Emergency Fund deposit — every month</h2>
    <div class="formula">Deposit = 10% × that month's total income</div>
    <div class="example"><p><b>Month 3:</b> 10% × ₹20,000 = <b>₹2,000</b>, moved automatically before anything else is spent.</p></div>

    <h2>4. A decision card</h2>
    <div class="formula">Pay → Wallet −= cost &nbsp;|&nbsp; Use Emergency Fund → Fund −= cost</div>
    <div class="example"><p>Most decision cards are real — you either pay for it from your Wallet, or cover it from your Emergency Fund. A small few (the low-stakes, social ones) also let you Skip for free. You won't know which is which until the card is in front of you.</p></div>

    <h2>5. Investment growth — every month, automatically</h2>
    <div class="formula">New balance = Old balance × (1 + that month's % change)</div>
    <div class="example"><p><b>Example:</b> if Stocks held ₹1,000 going into a month and the market moves −7% that month, the new balance is ₹1,000 × (1 − 0.07) = <b>₹930</b>. Gold and SIP are calculated the same way, with their own (usually smaller, steadier) percentage.</p></div>
    <p>This happens every month to whatever is currently invested — even in months with no new investing round.</p>

    <h2>6. The Emergency</h2>
    <div class="formula">If Emergency Fund ≥ bill → Fund −= bill, no loan. If Emergency Fund &lt; bill → shortfall = bill − Fund; Fund → 0; Loan owed = shortfall × 1.20</div>
    <div class="example"><p>More than once across the two years, an emergency will land on you without warning — you won't know when. <b>Example:</b> the bill is ₹7,000. If your fund has only ₹4,000 saved, the shortfall is ₹3,000, and the loan owed next month is ₹3,000 × 1.20 = <b>₹3,600</b> — an extra ₹600 for not having enough saved. That loan is automatically deducted from the following month's income.</p></div>

    <h2>7. Final score</h2>
    <div class="formula">Final score = Wallet + Emergency Fund + Investments − any outstanding loan</div>

    <p style="margin-top:30px; font-size:12.5px; opacity:.7;">Money Matters — Simulation · GamesForEd × Active Canvas</p>
  </div></div>`;
