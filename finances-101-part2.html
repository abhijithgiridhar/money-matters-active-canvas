<style>
  :root{ --ink:#0b0f0d; --paper:#f1ecdd; --paper-dim:#a9a291; --gold:#c9a227; --gold-bright:#e8c65c; --line:#2a332e; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--ink); color:var(--paper); font-family:'Spectral',Georgia,serif; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 24px; }
  .kicker{ font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); }

  p{ color:var(--paper-dim); font-size:16px; max-width:520px; margin:0 auto 26px; line-height:1.6; }
  a{ font-family:'IBM Plex Mono',monospace; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:13px; color:var(--gold-bright); text-decoration:none; border:1px solid var(--line); padding:12px 20px; border-radius:4px; }
  .tag{ display:inline-block; margin-top:20px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--line); color:var(--paper-dim); padding:5px 12px; border-radius:20px; }
